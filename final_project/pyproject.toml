[project]
name = "nh-futures-mcp"
version = "0.1.0"
description = "NH선물 Open API(모의 서버)를 AI 클라이언트가 쓸 수 있게 하는 원격 MCP 서버"
readme = "README.md"
authors = [
    { name = "eunseokYoon", email = "dmstjrwltjr@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastmcp>=4.2.4,<5",
    "httpx2>=2.16.2,<3",
    "pydantic>=2.14.4",
    # 모델 파일 화면이 올리기 본문을 받는 대로 읽는다(nh_mcp/models/page.py).
    "python-multipart>=0.0.34,<0.1",
    # 시세 수신기의 NH 웹소켓 연결(nh_mcp/realtime/session.py).
    "websockets>=17.4,<18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nh_mcp"]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: 실제 Docker로 도는 격리 테스트(Docker가 없으면 건너뛰지 않고 실패한다)",
]

# 의존 방향: tools · runner → services → markets → realtime → nh. guard는 계층 밖(services만 부른다).
# realtime(시세 수신기)은 NH 클라이언트 쪽이다. nh 위에 두어 웹소켓 키를 nh로 받는다.
# 괄호는 아직 없는 계층(선택 계층). 계층이 생기면 괄호를 벗긴다.
# tools | runner: 서로 import 금지.
# exhaustive: nh_mcp 아래 새 패키지는 계층에 넣거나 계층 밖 목록에 적어야 한다.
# TODO(M4): runner를 금지 계약의 출발점에 넣는다.
#   forbidden 계약은 없는 모듈을 오류로 보므로 대상 패키지가 생길 때 넣는다.
[tool.importlinter]
root_package = "nh_mcp"

[[tool.importlinter.contracts]]
name = "계층 의존 방향"
type = "layers"
containers = ["nh_mcp"]
layers = [
    "tools | (runner)",
    "services",
    "markets",
    "realtime",
    "nh",
]
exhaustive = true
# 계층 밖: 공용 타입·설정·응답 형식·로그인·키 보관·모델 파일 보관·운영 보호 장치(속도 제한)·
# 저장소·서버 조립·전략 격리 실행·백테스트 계산.
exhaustive_ignores = [
    "auth",
    "config",
    "domain",
    "envelope",
    "guard",
    "keys",
    "models",
    "ops",
    "sandbox",
    "server",
    "store",
    "strategies",
]

[[tool.importlinter.contracts]]
name = "도구는 services만 거친다(markets·realtime·nh·guard 직접 호출 금지)"
type = "forbidden"
source_modules = ["nh_mcp.tools"]
forbidden_modules = ["nh_mcp.markets", "nh_mcp.realtime", "nh_mcp.nh", "nh_mcp.guard"]
# services를 거치는 간접 import는 설계대로다. 직접 import만 막는다.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "계층 밖 패키지는 도구·서비스·시장·서버를 부르지 않는다"
type = "forbidden"
source_modules = [
    "nh_mcp.auth",
    "nh_mcp.config",
    "nh_mcp.domain",
    "nh_mcp.envelope",
    "nh_mcp.keys",
    "nh_mcp.models",
    "nh_mcp.ops",
    "nh_mcp.sandbox",
    "nh_mcp.store",
    "nh_mcp.strategies",
]
forbidden_modules = [
    "nh_mcp.tools",
    "nh_mcp.services",
    "nh_mcp.markets",
    "nh_mcp.realtime",
    "nh_mcp.server",
]

[[tool.importlinter.contracts]]
name = "domain은 다른 nh_mcp 모듈을 import하지 않는다"
type = "forbidden"
source_modules = ["nh_mcp.domain"]
forbidden_modules = ["nh_mcp.*"]

[[tool.importlinter.contracts]]
name = "guard는 domain만 import한다(순수 로직)"
type = "forbidden"
source_modules = ["nh_mcp.guard"]
forbidden_modules = ["nh_mcp.*"]
# 새 nh_mcp 패키지는 자동으로 금지된다. domain만 허용한다.
ignore_imports = [
    "nh_mcp.guard.** -> nh_mcp.domain",
]

[[tool.importlinter.contracts]]
name = "sandbox·strategies는 domain만 import한다(실행기의 대화는 체결 계산도)"
type = "forbidden"
source_modules = ["nh_mcp.sandbox", "nh_mcp.strategies"]
forbidden_modules = ["nh_mcp.*"]
# domain만 허용한다. 하나만 더: 실행기의 대화(sandbox/container.py)는 체결 이벤트를 만들려고
# 체결 계산(strategies/backtest.py)을 돌린다(2026-11-25 사람 승인). sandbox/harness.py는 nh_mcp를
# 하나도 쓰지 않는다(tests/sandbox/test_harness_imports.py).
ignore_imports = [
    "nh_mcp.sandbox.** -> nh_mcp.domain",
    "nh_mcp.strategies.** -> nh_mcp.domain",
    "nh_mcp.sandbox.container -> nh_mcp.strategies.backtest",
]
