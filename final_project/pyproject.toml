[project]
name = "nh-futures-mcp"
version = "0.1.0"
description = "NH선물 Open API(모의 서버)를 AI 클라이언트가 쓸 수 있게 하는 원격 MCP 서버"
readme = "README.md"
authors = [
    { name = "eunseokYoon", email = "dmstjrwltjr@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastmcp>=4.2.4,<5",
    "httpx2>=2.16.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nh_mcp"]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 의존 방향: tools · runner → services → markets → nh. guard는 계층 밖(services만 부른다).
# 괄호는 아직 없는 계층(선택 계층). 계층이 생기면 괄호를 벗긴다.
# tools | runner: 서로 import 금지.
# exhaustive: nh_mcp 아래 새 패키지는 계층에 넣거나 계층 밖 목록에 적어야 한다.
# TODO(M2): guard를 금지 계약의 대상에 넣고, guard 순수성 계약(guard는 domain만 import)을 넣는다.
# TODO(M4): runner를 금지 계약의 출발점에 넣는다.
#   forbidden 계약은 없는 모듈을 오류로 보므로 대상 패키지가 생길 때 넣는다.
[tool.importlinter]
root_package = "nh_mcp"

[[tool.importlinter.contracts]]
name = "계층 의존 방향"
type = "layers"
containers = ["nh_mcp"]
layers = [
    "tools | (runner)",
    "services",
    "markets",
    "nh",
]
exhaustive = true
# 계층 밖: 공용 타입·설정·응답 형식·로그인·키 보관·저장소·서버 조립.
exhaustive_ignores = ["auth", "config", "domain", "envelope", "keys", "server", "store"]

[[tool.importlinter.contracts]]
name = "도구는 services만 거친다(markets·nh 직접 호출 금지)"
type = "forbidden"
source_modules = ["nh_mcp.tools"]
forbidden_modules = ["nh_mcp.markets", "nh_mcp.nh"]
# services를 거치는 간접 import는 설계대로다. 직접 import만 막는다.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "계층 밖 패키지는 도구·서비스·시장·서버를 부르지 않는다"
type = "forbidden"
source_modules = [
    "nh_mcp.auth",
    "nh_mcp.config",
    "nh_mcp.domain",
    "nh_mcp.envelope",
    "nh_mcp.keys",
    "nh_mcp.store",
]
forbidden_modules = ["nh_mcp.tools", "nh_mcp.services", "nh_mcp.markets", "nh_mcp.server"]

[[tool.importlinter.contracts]]
name = "domain은 다른 nh_mcp 모듈을 import하지 않는다"
type = "forbidden"
source_modules = ["nh_mcp.domain"]
forbidden_modules = ["nh_mcp.*"]
